services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seekiee
      POSTGRES_PASSWORD: seekiee
      POSTGRES_DB: seekiee
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seekiee"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database — points to the local postgres service above
      POSTGRES_URL: postgres://seekiee:seekiee@db:5432/seekiee
      POSTGRES_PRISMA_URL: postgres://seekiee:seekiee@db:5432/seekiee?pgbouncer=true&connect_timeout=15
      POSTGRES_URL_NON_POOLING: postgres://seekiee:seekiee@db:5432/seekiee
      POSTGRES_USER: seekiee
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: seekiee
      POSTGRES_DATABASE: seekiee
      # Clerk — set these in a .env file (see apps/web/.env.local.example)
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /onboarding
      # Anthropic — for AI evaluation
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
